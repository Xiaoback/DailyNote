name: Build public beta
on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Scripts/**'
      - 'Resources/**'
      - 'Tests/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-beta-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check core behavior
        run: bash Scripts/check.sh
      - name: Build universal standalone app
        run: bash Scripts/build-standalone.sh
      - name: Package application
        run: |
          mkdir -p build/disk-image build/release
          ditto build/standalone/DailyNote.app build/disk-image/DailyNote.app
          cp LICENSE build/disk-image/DailyNote.app/Contents/Resources/LICENSE.txt
          cp README.md build/disk-image/DailyNote.app/Contents/Resources/README.txt
          codesign --force --sign - build/disk-image/DailyNote.app
          codesign --verify --strict build/disk-image/DailyNote.app
          ln -s /Applications build/disk-image/Applications
          cp README.md build/disk-image/README.txt
          hdiutil create -volname DailyNote -srcfolder build/disk-image -format UDZO build/release/DailyNote-0.1.0-beta.1-universal.dmg
          cd build/release
          shasum -a 256 DailyNote-0.1.0-beta.1-universal.dmg > SHA256SUMS.txt
      - name: Publish first public beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0-beta.1 >/dev/null 2>&1; then
            echo 'This version already exists. Update the release version before publishing another build.'
            exit 1
          fi
          gh release create v0.1.0-beta.1 build/release/* \
            --target "$GITHUB_SHA" --prerelease \
            --title '今日便笺 v0.1.0-beta.1' --notes-file RELEASE-NOTES.md
